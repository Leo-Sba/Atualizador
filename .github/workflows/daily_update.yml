name: Pipeline Diario em Cascata B3 & CVM (4 Estagios)

on:
  schedule:
    # Executa de segunda a sexta-feira às 22:30 UTC (19:30 Horário de Brasília)
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Permite execução manual a qualquer momento

# Trava global de concorrência: impede que dois workflows ou execuções manuais
# acessem e sobrecarreguem o banco Supabase simultaneamente.
concurrency:
  group: b3-supabase-pipeline
  cancel-in-progress: false

env:
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  # =========================================================================
  # ESTÁGIO 1: Ingestão de Mercado (Limpeza, Cotações Diárias e Proventos)
  # =========================================================================
  stage-1-ingestion:
    name: "1. Ingestao de Mercado (Precos & Proventos)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Estágio 1 (Limpeza, Preços e Proventos)
        run: |
          python run_updater.py --stage 1

  # =========================================================================
  # ESTÁGIO 2: Motor de Cálculo Fundamentalista (P/L, P/VP, ROE, LPA, VPA, DY)
  # =========================================================================
  stage-2-metrics:
    name: "2. Calculo Fundamentalista (Multiplos & DY)"
    needs: stage-1-ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Estágio 2 (Métricas e Dividend Yield)
        run: |
          sleep 5
          python run_updater.py --stage 2

  # =========================================================================
  # ESTÁGIO 3: Consolidação de Índices (IBOV, IFNC) e Calendário de Resultados
  # =========================================================================
  stage-3-indices:
    name: "3. Consolidacao de Indices (IBOV, IFNC & Calendario)"
    needs: stage-2-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Estágio 3 (IBOV, IFNC e Calendário)
        run: |
          sleep 5
          python run_updater.py --stage 3

  # =========================================================================
  # ESTÁGIO 4: Auto-Cura (Self-Healing) e Auditoria Contínua de Anomalias
  # =========================================================================
  stage-4-audit-and-heal:
    name: "4. Auto-Cura e Auditoria de Anomalias"
    needs: stage-3-indices
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Estágio 4 (Auto-Cura e Auditoria Contínua)
        run: |
          sleep 5
          python run_updater.py --stage 4

  # =========================================================================
  # ESTÁGIO 5: Compilação do Dashboard e Deploy em Produção (Vercel)
  # =========================================================================
  stage-5-deploy:
    name: "5. Compilacao do Dashboard & Deploy Vercel"
    needs: stage-4-audit-and-heal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configurar Node.js (Vercel CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Estágio 5 (Exportar Dados e Compilar dashboard.html)
        run: |
          sleep 5
          python run_updater.py --stage 5

      - name: Preparar Diretório de Deploy
        run: |
          mkdir -p deploy_dist
          cp dashboard.html deploy_dist/index.html
          [ -f anomalias.html ] && cp anomalias.html deploy_dist/
          [ -f anomalies_data.json ] && cp anomalies_data.json deploy_dist/
          [ -f events_data.json ] && cp events_data.json deploy_dist/
          [ -d events ] && cp -r events deploy_dist/
          [ -f vercel.json ] && cp vercel.json deploy_dist/

      - name: Publicar em Produção na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Iniciando deploy em producao na Vercel..."
            ORG_ID="${VERCEL_ORG_ID:-team_Vq8xybWYkCQy4ZCfUg2rDEfv}"
            PROJECT_ID="${VERCEL_PROJECT_ID:-prj_iTbDA9V8SZyxoUIxuNzbpV2SIQoB}"
            mkdir -p deploy_dist/.vercel
            echo "{\"projectId\":\"$PROJECT_ID\",\"orgId\":\"$ORG_ID\",\"projectName\":\"dashboard-ibov-preco-lucro\"}" > deploy_dist/.vercel/project.json
            npx vercel --prod --token="$VERCEL_TOKEN" --yes deploy_dist
          else
            echo "::warning::Secret VERCEL_TOKEN nao configurado no repositorio. O deploy automatico na Vercel foi pulado."
          fi
