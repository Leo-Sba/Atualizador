name: Atualização Diária B3 & Fundamentalista

on:
  schedule:
    # Executa de segunda a sexta-feira às 22:30 UTC (19:30 Horário de Brasília) após o fechamento dos pregões
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Permite execução manual a qualquer momento pelo botão "Run workflow"

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline de Atualização
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python run_updater.py
