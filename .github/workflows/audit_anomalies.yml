name: Auditoria e Auto-Cura Manual (Sob Demanda)

on:
  # A auditoria diária agora roda automaticamente como o Estágio 4 em cascata
  # dentro do workflow 'daily_update.yml' logo após o cálculo dos índices.
  # Este workflow permanece disponível para execuções avulsas sob demanda.
  workflow_dispatch:

concurrency:
  group: b3-supabase-pipeline
  cancel-in-progress: false

env:
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  audit-and-heal:
    name: "Auditoria e Auto-Cura Isolada"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Estágio 4 (Auto-Cura + Auditoria Contínua)
        run: |
          python run_updater.py --stage 4
