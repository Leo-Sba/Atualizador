name: Atualizar Banco de Bloqueios de Inplit (IFR - Sábado)

on:
  schedule:
    # Todo sábado às 15:00 Horário de Brasília (UTC-3) = 18:00 UTC
    - cron: '0 18 * * 6'
  workflow_dispatch:

concurrency:
  group: b3-ifr-tracker
  cancel-in-progress: false

jobs:
  atualizar-bloqueios-inplit:
    name: Sincronizar Bloqueios de Inplit (Firestore)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar Dependências
        run: |
          npm ci || npm install

      - name: Atualizar Banco de Bloqueios de Inplit no Firebase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          node atualizar-bloqueios-inplit.js

      - name: Commit e Push do Cache Sincronizado (Se houver alterações)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions [Bloqueios Inplit IFR]"
          if [ -f entradas_ifr_cache.json ]; then
            git add entradas_ifr_cache.json
            git diff --quiet && git diff --staged --quiet || git commit -m "chore(ifr): atualizar cache de bloqueios de inplit [skip ci]"
            git push || true
          fi
